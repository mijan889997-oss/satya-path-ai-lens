<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satya Path AI - Smart Lens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        /* স্ক্যানিং এনিমেশনের জন্য কাস্টম স্টাইল */
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .scanner-line {
            animation: scan 2s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
            Satya Path AI - Smart Lens
        </h1>
        <p class="text-gray-400 mb-6">যেকোনো ছবি আপলোড করুন, এআই মুহূর্তেই টেক্সট এক্সট্রাক্ট ও ট্রান্সলেট করে দেবে!</p>

        <div id="drop-zone" class="relative border-4 border-dashed border-gray-600 rounded-xl p-8 hover:border-cyan-400 transition cursor-pointer mb-6">
            <div id="scanner" class="absolute left-0 w-full h-1 bg-cyan-400 scanner-line hidden"></div>
            
            <div id="upload-prompt">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="text-sm text-gray-300">এখানে ছবি ড্র্যাগ করে ছাড়ুন অথবা ক্লিক করে সিলেক্ট করুন</p>
            </div>
            <img id="preview-img" class="max-h-64 mx-auto rounded-lg hidden" alt="Preview">
            <input type="file" id="file-input" class="hidden" accept="image/*">
        </div>

        <div id="progress-container" class="hidden mb-4">
            <p id="progress-text" class="text-xs text-cyan-400 mb-1">প্রসেসিং হচ্ছে... ০%</p>
            <div class="w-full bg-gray-700 rounded-full h-2">
                <div id="progress-bar" class="bg-cyan-400 h-2 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-left text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">মূল টেক্সট (English)</label>
                <textarea id="extracted-text" class="w-full h-40 bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-400 resize-none" placeholder="ছবির ভেতরের লেখা এখানে আসবে..."></textarea>
            </div>
            <div>
                <label class="block text-left text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">অনুবাদ (Bangla)</label>
                <textarea id="translated-text" class="w-full h-40 bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-400 resize-none" placeholder="অনুবাদ করা লেখা এখানে দেখাবে..."></textarea>
            </div>
        </div>
    </div>

    <script>
        // জাভাস্ক্রিপ্ট লজিক আমরা পরের ধাপে এখানে যুক্ত করব।
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
    </script>
</body>
</html>
